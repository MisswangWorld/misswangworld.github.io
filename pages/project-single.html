<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project Details - Janis Wang">
  <title>Project | Janis Wang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../styles/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --sidebar-width: 200px;
    }

    /* Main Layout */
    .main-container {
      display: flex;
      min-height: 100vh;
      padding-top: 80px;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--gray-light);
      border-right: 1px solid #e5e5e5;
      padding: 32px 24px;
      position: fixed;
      top: 80px;
      left: 0;
      bottom: 0;
      overflow-y: auto;
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .sidebar-header {
      margin-bottom: 24px;
    }

    .sidebar-logo {
      max-width: 100%;
      max-height: 80px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      margin-bottom: 16px;
    }

    .sidebar-logo[src=''] {
      display: none;
    }

    .sidebar-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .project-name {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--black);
    }

    .version-list {
      list-style: none;
    }

    .sidebar-gallery {
      margin-bottom: 24px;
    }

    .sidebar-gallery[hidden] {
      display: none;
    }

    .version-item {
      margin-bottom: 8px;
    }

    .version-btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-dark);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .version-btn:hover {
      background: rgba(251, 172, 47, 0.1);
      color: var(--black);
    }

    .version-btn.active {
      background: var(--primary);
      color: var(--black);
      font-weight: 600;
    }

    .version-btn .version-label {
      display: block;
    }

    .version-btn .version-tag {
      font-size: 10px;
      color: var(--accent);
      font-weight: 400;
      margin-top: 2px;
    }

    .version-btn.active .version-tag {
      color: var(--black);
      opacity: 0.7;
    }

    .gallery-btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-dark);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .gallery-btn:hover {
      background: rgba(46, 154, 208, 0.1);
      color: var(--black);
    }

    .gallery-btn.active {
      background: var(--accent);
      color: var(--white);
      font-weight: 600;
    }

    .gallery-btn .gallery-count {
      display: block;
      font-size: 10px;
      color: inherit;
      font-weight: 400;
      margin-top: 2px;
      opacity: 0.78;
    }

    .sidebar-link-btn {
      display: block;
      text-decoration: none;
      transition: opacity 0.2s ease;
      margin-bottom: 28px;
    }

    .sidebar-link-btn:hover {
      opacity: 0.8;
    }

    .sidebar-link-btn.app-store img {
      width: 100%;
      height: auto;
      display: block;
    }

    .sidebar-link-btn.preview {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      background: var(--accent);
      color: #fff;
    }

    .sidebar-link-btn.preview svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* Sidebar toggle button */
    .sidebar-toggle {
      display: none;
      position: fixed;
      top: 100px;
      left: 16px;
      z-index: 101;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .sidebar-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--black);
    }

    /* Content Area */
    .content {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 48px;
      max-width: 900px;
    }

    .content-inner {
      max-width: 800px;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 32px;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: var(--primary);
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    /* Markdown Content Styles */
    .markdown-content h1 {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--black);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .markdown-content h2 {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--black);
      margin-top: 40px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary);
    }

    .markdown-content h3 {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--black);
      margin-top: 32px;
      margin-bottom: 12px;
    }

    .markdown-content p {
      font-size: 15px;
      color: var(--gray-dark);
      margin-bottom: 16px;
      line-height: 1.8;
    }

    .markdown-content ul,
    .markdown-content ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }

    .markdown-content li {
      font-size: 15px;
      color: var(--gray-dark);
      margin-bottom: 8px;
      line-height: 1.7;
    }

    .markdown-content a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }

    .markdown-content a:hover {
      border-bottom-color: var(--accent);
    }

    .markdown-content code {
      background: var(--gray-light);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 14px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
    }

    .markdown-content pre {
      background: var(--black);
      color: var(--white);
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .markdown-content pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    .markdown-content blockquote {
      border-left: 4px solid var(--primary);
      padding-left: 20px;
      margin: 20px 0;
      color: var(--gray-dark);
      font-style: italic;
    }

    .markdown-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 20px 0;
      display: block;
    }

    /* Ensure long words and URLs break properly */
    .markdown-content {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .markdown-content a {
      word-break: break-word;
    }

    .markdown-content hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 32px 0;
    }

    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    .markdown-content th,
    .markdown-content td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e5e5e5;
    }

    .markdown-content th {
      font-weight: 600;
      background: var(--gray-light);
    }

    /* Preview screenshot carousel */
    .example-gallery h1 {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--black);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .example-gallery-intro {
      font-size: 15px;
      color: var(--gray-dark);
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .example-carousel {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      gap: 16px;
      align-items: center;
    }

    .carousel-control {
      width: 44px;
      height: 44px;
      border: 1.5px solid var(--black);
      border-radius: 8px;
      background: transparent;
      color: var(--black);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .carousel-control:hover:not(:disabled) {
      background: var(--black);
      color: var(--white);
    }

    .carousel-control:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .carousel-control svg {
      width: 20px;
      height: 20px;
    }

    .carousel-stage {
      min-width: 0;
    }

    .carousel-image-btn {
      width: 100%;
      padding: 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      cursor: zoom-in;
      overflow: hidden;
      display: block;
      box-shadow: 0 18px 48px rgba(0,0,0,0.08);
    }

    .carousel-image-btn img {
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      display: block;
      background: var(--gray-light);
    }

    .carousel-caption {
      margin-top: 16px;
      color: var(--gray-dark);
      font-size: 15px;
      line-height: 1.7;
    }

    .carousel-meta {
      margin-top: 8px;
      color: var(--gray);
      font-size: 12px;
      font-family: 'Inter', sans-serif;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      border: none;
      border-radius: 50%;
      background: #d8d8d8;
      cursor: pointer;
      padding: 0;
    }

    .carousel-dot.active {
      background: var(--primary);
    }

    .image-lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: rgba(0,0,0,0.78);
      z-index: 1000;
    }

    .image-lightbox.open {
      display: flex;
    }

    .lightbox-content {
      max-width: min(1100px, 100%);
      max-height: 92vh;
      color: var(--white);
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 78vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
      background: var(--gray-light);
    }

    .lightbox-caption {
      max-width: 760px;
      margin: 16px auto 0;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,0.88);
      text-align: center;
    }

    .lightbox-close {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      color: var(--white);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.22);
    }

    .lightbox-close svg {
      width: 22px;
      height: 22px;
    }

    /* Loading & Error States */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--gray-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-dark);
    }

    .error h2 {
      font-family: 'Syne', sans-serif;
      color: var(--black);
      margin-bottom: 12px;
    }

    /* Footer — page-specific offset for sidebar layout */
    .footer {
      margin-left: var(--sidebar-width);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
        width: 260px;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-toggle {
        display: block;
      }

      .sidebar-toggle.open {
        left: 276px;
      }

      .content {
        margin-left: 0;
        padding: 48px 32px;
      }

      .footer {
        margin-left: 0;
      }

      /* Larger touch targets for version buttons */
      .version-btn,
      .gallery-btn {
        padding: 14px 16px;
        font-size: 16px;
      }

      /* Overlay when sidebar is open */
      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.3);
        z-index: 99;
      }

      .sidebar-overlay.open {
        display: block;
      }
    }

    @media (max-width: 600px) {
      .nav {
        padding: 16px 20px;
      }

      .main-container {
        padding-top: 70px;
      }

      .sidebar {
        top: 70px;
        width: 260px;
      }

      .sidebar-toggle {
        top: 86px;
        left: 12px;
        padding: 8px 12px;
      }

      .content {
        padding: 24px 16px;
      }

      .back-link {
        margin-bottom: 20px;
        font-size: 13px;
      }

      .markdown-content h1 {
        font-size: 24px;
        line-height: 1.3;
        word-wrap: break-word;
      }

      .example-gallery h1 {
        font-size: 24px;
        line-height: 1.3;
      }

      .example-carousel {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .carousel-control {
        display: none;
      }

      .carousel-image-btn img {
        max-height: 480px;
      }

      .image-lightbox {
        padding: 16px;
      }

      .lightbox-close {
        top: 16px;
        right: 16px;
      }

      .markdown-content h2 {
        font-size: 18px;
        margin-top: 32px;
        margin-bottom: 12px;
      }

      .markdown-content h3 {
        font-size: 16px;
        margin-top: 24px;
      }

      .markdown-content p {
        font-size: 15px;
        line-height: 1.7;
        margin-bottom: 14px;
      }

      .markdown-content ul,
      .markdown-content ol {
        padding-left: 20px;
      }

      .markdown-content li {
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 6px;
      }

      .markdown-content pre {
        padding: 16px;
        border-radius: 6px;
        font-size: 13px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .markdown-content code {
        font-size: 13px;
        word-break: break-word;
      }

      .markdown-content blockquote {
        padding-left: 16px;
        margin: 16px 0;
        font-size: 14px;
      }

      .markdown-content img {
        margin: 16px 0;
        border-radius: 6px;
      }

      .markdown-content table {
        display: block;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        font-size: 14px;
      }

      .markdown-content th,
      .markdown-content td {
        padding: 10px;
        white-space: nowrap;
      }

      .footer {
        padding: 20px 16px;
      }
    }

    /* Extra small screens */
    @media (max-width: 400px) {
      .nav {
        padding: 14px 16px;
      }

      .nav-logo {
        font-size: 16px;
      }

      .content {
        padding: 20px 14px;
      }

      .markdown-content h1 {
        font-size: 22px;
      }

      .example-gallery h1 {
        font-size: 22px;
      }

      .markdown-content h2 {
        font-size: 17px;
      }

      .markdown-content p,
      .markdown-content li {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <div id="nav-placeholder"></div>

  <!-- Sidebar Toggle Button (Mobile) -->
  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12h18M3 6h18M3 18h18"/>
    </svg>
  </button>

  <!-- Sidebar Overlay (Mobile) -->
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img id="sidebarLogo" class="sidebar-logo" src="" alt="" aria-hidden="true">
        <div id="sidebarLinkContainer"></div>
        <div class="project-name" id="projectName">Loading...</div>
      </div>
      <div class="sidebar-gallery" id="sidebarGallery" hidden>
        <div class="sidebar-title">Previews</div>
        <button class="gallery-btn" id="galleryBtn" type="button" onclick="loadPreviews()">
          <span>Screenshots</span>
          <span class="gallery-count" id="galleryCount"></span>
        </button>
      </div>
      <div class="sidebar-title">Versions</div>
      <ul class="version-list" id="versionList">
        <!-- Versions will be populated by JavaScript -->
      </ul>
    </aside>

    <!-- Content Area -->
    <main class="content">
      <a href="projects.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Projects
      </a>
      <div class="content-inner">
        <div id="markdownContent" class="markdown-content">
          <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading content...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="image-lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-label="Expanded image" onclick="handleLightboxBackdrop(event)">
    <button class="lightbox-close" type="button" onclick="closeLightbox()" aria-label="Close expanded image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="lightbox-content">
      <img id="lightboxImage" src="" alt="">
      <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>© 2026 Janis Wang</span>
    <span>Made with taste</span>
  </footer>

  <script src="../components/nav.js"></script>
  <script>
    // Get project name from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const projectName = urlParams.get('name');

    let manifest = null;
    let currentVersion = null;
    let currentView = null;
    let currentPreviewIndex = 0;

    // Toggle sidebar (mobile)
    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('open');
      document.querySelector('.sidebar-toggle').classList.toggle('open');
      document.querySelector('.sidebar-overlay').classList.toggle('open');
    }

    // Load project manifest
    async function loadManifest() {
      if (!projectName) {
        showError('No project specified', 'Please provide a project name in the URL (e.g., ?name=my-project)');
        return;
      }

      try {
        const response = await fetch(`../content/projects/${projectName}/manifest.json`);
        if (!response.ok) {
          throw new Error('Project not found');
        }
        manifest = await response.json();

        // Update page title
        document.title = `${manifest.title} | Janis Wang`;
        document.getElementById('projectName').textContent = manifest.title;

        // Set sidebar logo — uses sidebarLogo if specified, falls back to logo
        const logoEl = document.getElementById('sidebarLogo');
        const sidebarLogoSrc = manifest.sidebarLogo || manifest.logo;
        if (sidebarLogoSrc) {
          logoEl.src = `../content/projects/${projectName}/${sidebarLogoSrc.replace(/^\//, '')}`;
          logoEl.alt = manifest.title;
          logoEl.style.display = 'block';
        } else {
          logoEl.style.display = 'none';
        }

        // Populate sidebar link button
        populateSidebarLink();

        // Populate preview screenshot link
        populatePreviewGalleryLink();

        // Populate version list
        populateVersionList();

        // Load the requested hash view, or the latest version by default
        loadViewFromHash();

      } catch (error) {
        showError('Project Not Found', `Could not find project "${projectName}". Please check the project name and try again.`);
      }
    }

    function getPreviews() {
      if (!manifest) return [];
      const previews = manifest.previews || manifest.examples || manifest.gallery || manifest.exampleImages || [];
      return previews
        .map(preview => {
          if (typeof preview === 'string') {
            return { image: preview, description: '' };
          }
          return {
            image: preview.image || preview.src || preview.url || '',
            description: preview.description || preview.caption || preview.alt || '',
            title: preview.title || ''
          };
        })
        .filter(preview => preview.image);
    }

    function resolveProjectAssetPath(path) {
      if (!path) return '';
      if (/^(https?:)?\/\//.test(path) || path.startsWith('data:')) {
        return path;
      }
      return `../content/projects/${projectName}/${path.replace(/^\//, '')}`;
    }

    function closeSidebarOnMobile() {
      if (window.innerWidth <= 900) {
        document.querySelector('.sidebar').classList.remove('open');
        document.querySelector('.sidebar-toggle').classList.remove('open');
        document.querySelector('.sidebar-overlay').classList.remove('open');
      }
    }

    // Populate the App Store / preview link button in sidebar
    function populateSidebarLink() {
      const container = document.getElementById('sidebarLinkContainer');
      if (manifest.appStoreUrl) {
        container.innerHTML = `
          <a href="${manifest.appStoreUrl}" class="sidebar-link-btn app-store" target="_blank" rel="noopener noreferrer">
            <img src="../assets/appstore-badge.png" alt="Available on the App Store">
          </a>
        `;
      } else if (manifest.previewUrl) {
        container.innerHTML = `
          <a href="${manifest.previewUrl}" class="sidebar-link-btn preview" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Live Preview
          </a>
        `;
      }
    }

    function populatePreviewGalleryLink() {
      const previews = getPreviews();
      const sidebarGallery = document.getElementById('sidebarGallery');
      const galleryCount = document.getElementById('galleryCount');

      if (previews.length === 0) {
        sidebarGallery.hidden = true;
        return;
      }

      sidebarGallery.hidden = false;
      galleryCount.textContent = `${previews.length} screenshot${previews.length === 1 ? '' : 's'}`;
    }

    // Populate version buttons in sidebar
    function populateVersionList() {
      const versionList = document.getElementById('versionList');
      versionList.innerHTML = '';

      // Display versions in reverse order (latest first)
      const versionsReversed = [...manifest.versions].reverse();

      versionsReversed.forEach(version => {
        const li = document.createElement('li');
        li.className = 'version-item';

        const button = document.createElement('button');
        button.className = 'version-btn';
        button.onclick = () => loadVersion(version);

        const label = document.createElement('span');
        label.className = 'version-label';
        label.textContent = version;
        button.appendChild(label);

        // Add "latest" tag if applicable
        if (version === manifest.latest) {
          const tag = document.createElement('span');
          tag.className = 'version-tag';
          tag.textContent = 'latest';
          button.appendChild(tag);
        }

        li.appendChild(button);
        versionList.appendChild(li);
      });
    }

    // Load a specific version's markdown content
    async function loadVersion(version) {
      currentVersion = version;
      currentView = 'version';

      // Update URL hash
      window.location.hash = version;

      // Update active button state
      document.getElementById('galleryBtn')?.classList.remove('active');
      document.querySelectorAll('.version-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.querySelector('.version-label').textContent === version) {
          btn.classList.add('active');
        }
      });

      // Show loading state
      const contentDiv = document.getElementById('markdownContent');
      contentDiv.innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Loading ${version}...</p>
        </div>
      `;

      // Close sidebar on mobile after selection
      closeSidebarOnMobile();

      try {
        const response = await fetch(`../content/projects/${projectName}/${version}.md`);
        if (!response.ok) {
          throw new Error('Version not found');
        }
        const markdown = await response.text();

        // Render markdown to HTML
        contentDiv.innerHTML = marked.parse(markdown);

        // Scroll to top of content
        window.scrollTo({ top: 0, behavior: 'smooth' });

      } catch (error) {
        contentDiv.innerHTML = `
          <div class="error">
            <h2>Content Not Found</h2>
            <p>Could not load content for ${version}. The file may not exist.</p>
          </div>
        `;
      }
    }

    function loadPreviews(index = 0) {
      const previews = getPreviews();
      if (previews.length === 0) {
        return;
      }

      currentVersion = null;
      currentView = 'previews';
      currentPreviewIndex = Math.max(0, Math.min(index, previews.length - 1));
      window.location.hash = 'previews';

      document.querySelectorAll('.version-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('galleryBtn')?.classList.add('active');
      closeSidebarOnMobile();
      renderPreviews();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPreviews() {
      const previews = getPreviews();
      const current = previews[currentPreviewIndex];
      const contentDiv = document.getElementById('markdownContent');
      const imageSrc = resolveProjectAssetPath(current.image);
      const imageAlt = current.description || current.title || `${manifest.title} screenshot ${currentPreviewIndex + 1}`;
      const hasMultiple = previews.length > 1;

      contentDiv.innerHTML = `
        <section class="example-gallery">
          <h1>${escapeHtml(manifest.title)} - Screenshots</h1>
          <p class="example-gallery-intro">${escapeHtml(manifest.description || 'Project screenshots and visual previews.')}</p>
          <div class="example-carousel">
            <button class="carousel-control" type="button" onclick="showPreviousPreview()" aria-label="Previous screenshot" ${hasMultiple ? '' : 'disabled'}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="carousel-stage">
              <button class="carousel-image-btn" type="button" onclick="openLightbox(${currentPreviewIndex})" aria-label="Expand screenshot">
                <img src="${escapeHtml(imageSrc)}" alt="${escapeHtml(imageAlt)}">
              </button>
              ${current.description ? `<p class="carousel-caption">${escapeHtml(current.description)}</p>` : ''}
              <p class="carousel-meta">${currentPreviewIndex + 1} / ${previews.length}</p>
            </div>
            <button class="carousel-control" type="button" onclick="showNextPreview()" aria-label="Next screenshot" ${hasMultiple ? '' : 'disabled'}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          ${hasMultiple ? `
            <div class="carousel-dots" aria-label="Choose screenshot">
              ${previews.map((_, index) => `
                <button class="carousel-dot ${index === currentPreviewIndex ? 'active' : ''}" type="button" onclick="showPreview(${index})" aria-label="Show screenshot ${index + 1}"></button>
              `).join('')}
            </div>
          ` : ''}
        </section>
      `;
    }

    function showPreview(index) {
      currentPreviewIndex = index;
      renderPreviews();
    }

    function showPreviousPreview() {
      const previews = getPreviews();
      currentPreviewIndex = (currentPreviewIndex - 1 + previews.length) % previews.length;
      renderPreviews();
    }

    function showNextPreview() {
      const previews = getPreviews();
      currentPreviewIndex = (currentPreviewIndex + 1) % previews.length;
      renderPreviews();
    }

    function openLightbox(index) {
      const previews = getPreviews();
      const preview = previews[index];
      const imageSrc = resolveProjectAssetPath(preview.image);
      const imageAlt = preview.description || preview.title || `${manifest.title} screenshot ${index + 1}`;

      document.getElementById('lightboxImage').src = imageSrc;
      document.getElementById('lightboxImage').alt = imageAlt;
      document.getElementById('lightboxCaption').textContent = preview.description || '';
      document.getElementById('imageLightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('imageLightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function handleLightboxBackdrop(event) {
      if (event.target.id === 'imageLightbox') {
        closeLightbox();
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function loadViewFromHash() {
      const hashValue = window.location.hash.replace('#', '');
      const previews = getPreviews();

      if ((hashValue === 'previews' || hashValue === 'examples') && previews.length > 0) {
        loadPreviews(currentPreviewIndex);
        return;
      }

      const versionToLoad = hashValue && manifest.versions.includes(hashValue)
        ? hashValue
        : manifest.latest || manifest.versions[manifest.versions.length - 1];

      loadVersion(versionToLoad);
    }

    // Show error message
    function showError(title, message) {
      document.getElementById('projectName').textContent = 'Error';
      document.getElementById('versionList').innerHTML = '';
      document.getElementById('markdownContent').innerHTML = `
        <div class="error">
          <h2>${title}</h2>
          <p>${message}</p>
          <p style="margin-top: 20px;">
            <a href="projects.html" style="color: var(--primary);">← Back to Projects</a>
          </p>
        </div>
      `;
    }

    // Handle browser back/forward
    window.addEventListener('hashchange', () => {
      const hashValue = window.location.hash.replace('#', '');
      if (!manifest) return;

      if ((hashValue === 'previews' || hashValue === 'examples') && currentView !== 'previews') {
        loadPreviews(currentPreviewIndex);
      } else if (hashValue && manifest.versions.includes(hashValue) && hashValue !== currentVersion) {
        loadVersion(hashValue);
      } else if (!hashValue) {
        loadViewFromHash();
      }
    });

    window.addEventListener('keydown', (event) => {
      const lightboxOpen = document.getElementById('imageLightbox').classList.contains('open');
      if (event.key === 'Escape' && lightboxOpen) {
        closeLightbox();
      }

      if (currentView === 'previews' && !lightboxOpen) {
        if (event.key === 'ArrowLeft') {
          showPreviousPreview();
        } else if (event.key === 'ArrowRight') {
          showNextPreview();
        }
      }
    });

    // Initialize
    loadManifest();
  </script>
</body>
</html>
