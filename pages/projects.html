<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="All Projects - Janis Wang">
  <title>All Projects | Janis Wang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/shared.css">
  <style>
    /* Page Header */
    .page-header {
      padding: 140px 48px 60px;
      background: var(--primary);
      text-align: center;
    }

    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: var(--black);
      margin-bottom: 12px;
    }

    .page-header p {
      color: rgba(0,0,0,0.6);
      font-size: 16px;
    }

    /* Projects Section */
    .projects {
      padding: 60px 48px 80px;
      background: var(--gray-light);
      min-height: calc(100vh - 300px);
    }

    .projects-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .project-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      color: inherit;
      display: block;
      cursor: pointer;
    }

    .project-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.1);
    }

    .project-image {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .project-logo {
      max-width: 60%;
      max-height: 120px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
    }

    .project-number {
      font-family: 'Syne', sans-serif;
      font-size: 56px;
      color: rgba(0,0,0,0.15);
      font-weight: 700;
    }

    .project-badge {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: var(--accent);
      color: white;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .project-info {
      padding: 24px;
    }

    .project-title {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--black);
    }

    .project-desc {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 16px;
    }

    .project-link-btn {
      display: inline-block;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .project-link-btn:hover {
      opacity: 0.8;
    }

    .project-link-btn.app-store img {
      height: 36px;
      width: auto;
      display: block;
    }

    .project-link-btn.preview {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--accent);
      color: #fff;
    }

    .project-link-btn.preview svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--gray-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--gray);
    }

    .empty-state h2 {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      color: var(--black);
      margin-bottom: 12px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .projects-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .page-header {
        padding: 120px 32px 50px;
      }

      .page-header h1 {
        font-size: 36px;
      }

      .projects {
        padding: 50px 32px 60px;
      }
    }

    @media (max-width: 600px) {
      .page-header {
        padding: 100px 24px 40px;
      }

      .page-header h1 {
        font-size: 28px;
      }

      .projects {
        padding: 40px 24px 50px;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <div id="nav-placeholder"></div>

  <!-- Page Header -->
  <header class="page-header">
    <h1>All Projects</h1>
    <p>Explore my work and experiments</p>
  </header>

  <!-- Projects Section -->
  <section class="projects">
    <div class="projects-inner">
      <div class="projects-grid" id="projectsGrid">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Loading projects...</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <span>© 2026 Janis Wang</span>
    <span>Made with taste</span>
  </footer>

  <script src="../components/nav.js"></script>
  <script>

    // Color palette for project cards
    const colorPalette = [
      '#fbac2f', // primary
      '#e99a1e', // primary-dark
      '#ffc04d', // primary-light
      '#2E9AD0', // accent
      '#7B68EE', // purple
      '#20B2AA', // teal
    ];

    // Load a single project's manifest
    async function loadProjectManifest(projectId) {
      const response = await fetch(`../content/projects/${projectId}/manifest.json`);
      if (!response.ok) return null;
      const data = await response.json();
      return { id: projectId, ...data };
    }

    // Load all projects from their individual manifests
    async function loadProjects() {
      const grid = document.getElementById('projectsGrid');

      try {
        // Load global manifest to get project list
        const response = await fetch('../content/projects/manifest.json');
        if (!response.ok) {
          throw new Error('Failed to load projects list');
        }
        const data = await response.json();
        const projectIds = data.all || [];

        if (projectIds.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <h2>No Projects Yet</h2>
              <p>Check back soon for new projects!</p>
            </div>
          `;
          return;
        }

        // Load each project's manifest
        const projects = await Promise.all(
          projectIds.map(id => loadProjectManifest(id))
        );
        const validProjects = projects.filter(p => p !== null);

        // Render project cards
        grid.innerHTML = validProjects.map((project, index) => {
          const color = project.color || colorPalette[index % colorPalette.length];
          const number = String(index + 1).padStart(2, '0');
          const logoPath = project.logo ? `../content/projects/${project.id}/${project.logo}` : null;

          const linkBtn = project.appStoreUrl
            ? `<a href="${project.appStoreUrl}" class="project-link-btn app-store" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
                <img src="../assets/appstore-badge.png" alt="Available on the App Store">
              </a>`
            : project.previewUrl
            ? `<a href="${project.previewUrl}" class="project-link-btn preview" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                Live Preview
              </a>`
            : '';

          return `
            <div class="project-card" role="link" tabindex="0"
              onclick="window.location.href='project-single.html?name=${project.id}'"
              onkeydown="if(event.key==='Enter')window.location.href='project-single.html?name=${project.id}'">
              <div class="project-image" style="background: ${color};">
                ${logoPath
                  ? `<img src="${logoPath}" alt="${project.title}" class="project-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                     <span class="project-number" style="display:none;">${number}</span>`
                  : `<span class="project-number">${number}</span>`
                }
                ${project.badge ? `<span class="project-badge">${project.badge}</span>` : ''}
              </div>
              <div class="project-info">
                <h3 class="project-title">${project.title}</h3>
                <p class="project-desc">${project.description}</p>
                ${linkBtn}
              </div>
            </div>
          `;
        }).join('');

      } catch (error) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <h2>Unable to Load Projects</h2>
            <p>Please try again later.</p>
          </div>
        `;
      }
    }

    // Initialize
    loadProjects();
  </script>
</body>
</html>
