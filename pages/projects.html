<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="All Projects - Janis Wang">
  <title>All Projects | Janis Wang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../styles/shared.css">
  <style>
    /* Page */
    .projects-page {
      padding: 120px 48px 80px;
      background: var(--white);
      min-height: 100vh;
    }

    .projects-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    .projects-header {
      margin-bottom: 40px;
    }

    .projects-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(30px, 4vw, 44px);
      font-weight: 800;
      color: var(--black);
      line-height: 1.12;
      margin-bottom: 32px;
      letter-spacing: 0;
    }

    /* Controls bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Filter tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 7px 16px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border: 1.5px solid var(--black);
      background: transparent;
      color: var(--black);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Syne', sans-serif;
    }

    .filter-tab:hover {
      background: var(--black);
      color: var(--white);
    }

    .filter-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--black);
    }

    /* View toggle */
    .view-toggle {
      display: flex;
      gap: 4px;
    }

    .view-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Syne', sans-serif;
    }

    .view-btn.active {
      border-color: var(--black);
      color: var(--black);
    }

    /* ── GRID VIEW ── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .project-card {
      display: block;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      color: inherit;
      background: white;
      border: 1px solid rgba(0,0,0,0.07);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.1);
    }

    /* Featured first card: spans 2 cols, taller */
    .project-card:first-child {
      grid-column: span 2;
    }

    .project-card:first-child .card-image {
      height: 360px;
    }

    .project-card:first-child .card-overlay-title {
      font-size: 26px;
    }

    /* Card image */
    .card-image {
      height: 220px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 35%, rgba(0,0,0,0.55) 100%);
      z-index: 1;
    }

    .card-logo {
      max-width: 50%;
      max-height: 48%;
      object-fit: contain;
      border-radius: 14px;
      position: relative;
      z-index: 0;
      transition: transform 0.35s ease;
    }

    .project-card:hover .card-logo {
      transform: scale(1.05);
    }

    /* Overlay info (visible in grid, hidden in list) */
    .card-overlay-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      z-index: 2;
    }

    .card-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      background: var(--primary);
      color: var(--black);
      margin-bottom: 6px;
    }

    .card-overlay-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      line-height: 1.15;
    }

    /* Card body */
    .card-body {
      padding: 14px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* List-only title/badge row (hidden in grid) */
    .card-list-header {
      display: none;
    }

    .card-desc {
      font-size: 13px;
      color: var(--gray);
      flex: 1;
    }

    .card-link-btn.app-store img {
      height: 28px;
      width: auto;
      display: block;
    }

    .card-link-btn.preview {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
    }

    .card-link-btn.preview svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    /* ── LIST VIEW ── */
    .projects-grid.list-view {
      grid-template-columns: 1fr;
      gap: 0;
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 10px;
      overflow: hidden;
    }

    .projects-grid.list-view .project-card {
      grid-column: span 1 !important;
      border-radius: 0;
      border: none;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      display: flex;
      flex-direction: row;
    }

    .projects-grid.list-view .project-card:last-child {
      border-bottom: none;
    }

    .projects-grid.list-view .project-card:hover {
      transform: none;
      box-shadow: none;
      background: var(--gray-light);
    }

    .projects-grid.list-view .card-image {
      width: 100px;
      height: 68px !important;
      flex-shrink: 0;
      border-radius: 0;
    }

    .projects-grid.list-view .card-image-gradient,
    .projects-grid.list-view .card-overlay-info {
      display: none;
    }

    .projects-grid.list-view .card-logo {
      max-width: 60%;
      max-height: 60%;
      border-radius: 8px;
    }

    .projects-grid.list-view .card-body {
      padding: 0 20px;
      flex: 1;
      align-items: center;
      gap: 16px;
    }

    .projects-grid.list-view .card-list-header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .projects-grid.list-view .card-list-header .card-badge {
      margin-bottom: 0;
    }

    .projects-grid.list-view .card-list-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--black);
      white-space: nowrap;
    }

    .projects-grid.list-view .card-desc {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* Loading */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--gray);
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--gray-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 900px) {
      .projects-page {
        padding: 100px 32px 60px;
      }

      .projects-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .project-card:first-child {
        grid-column: span 2;
      }

      .project-card:first-child .card-image {
        height: 280px;
      }
    }

    @media (max-width: 600px) {
      .projects-page {
        padding: 80px 20px 50px;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .project-card:first-child {
        grid-column: span 1;
      }

      .project-card:first-child .card-image {
        height: 220px;
      }

      .project-card:first-child .card-overlay-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="projects-page">
    <div class="projects-inner">
      <div class="projects-header">
        <h1>Projects &amp; Case Studies</h1>
        <div class="controls-bar">
          <div class="filter-tabs" id="filterTabs">
            <button class="filter-tab active" data-filter="all">All</button>
          </div>
          <div class="view-toggle">
            <button class="view-btn active" id="gridViewBtn" onclick="setView('grid')">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor">
                <rect x="0" y="0" width="5.5" height="5.5" rx="1"/>
                <rect x="7.5" y="0" width="5.5" height="5.5" rx="1"/>
                <rect x="0" y="7.5" width="5.5" height="5.5" rx="1"/>
                <rect x="7.5" y="7.5" width="5.5" height="5.5" rx="1"/>
              </svg>
              Grid
            </button>
            <button class="view-btn" id="listViewBtn" onclick="setView('list')">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor">
                <rect x="0" y="0" width="13" height="2" rx="1"/>
                <rect x="0" y="5.5" width="13" height="2" rx="1"/>
                <rect x="0" y="11" width="13" height="2" rx="1"/>
              </svg>
              List
            </button>
          </div>
        </div>
      </div>

      <div class="projects-grid" id="projectsGrid">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Loading projects...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span>© 2026 Janis Wang</span>
    <span>Made with taste</span>
  </footer>

  <script src="../components/nav.js"></script>
  <script>
    let allProjects = [];
    let currentView = 'grid';

    async function loadProjectManifest(projectId) {
      const response = await fetch(`../content/projects/${projectId}/manifest.json`);
      if (!response.ok) return null;
      const data = await response.json();
      return { id: projectId, ...data };
    }

    function buildFilterTabs(projects) {
      const badges = [...new Set(projects.map(p => p.badge).filter(Boolean))];
      const tabsEl = document.getElementById('filterTabs');
      tabsEl.innerHTML = `
        <button class="filter-tab active" data-filter="all" onclick="filterProjects('all')">All</button>
        ${badges.map(badge => `
          <button class="filter-tab" data-filter="${badge}" onclick="filterProjects('${badge}')">${badge}</button>
        `).join('')}
      `;
    }

    function filterProjects(filter) {
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.filter === filter);
      });
      const filtered = filter === 'all' ? allProjects : allProjects.filter(p => p.badge === filter);
      renderCards(filtered);
    }

    function setView(view) {
      currentView = view;
      document.getElementById('gridViewBtn').classList.toggle('active', view === 'grid');
      document.getElementById('listViewBtn').classList.toggle('active', view === 'list');
      document.getElementById('projectsGrid').classList.toggle('list-view', view === 'list');
    }

    function buildLinkBtn(project) {
      if (project.appStoreUrl && project.appStoreUrl.trim()) {
        return `<a href="${project.appStoreUrl}" class="card-link-btn app-store" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
          <img src="../assets/appstore-badge.png" alt="Available on the App Store">
        </a>`;
      }
      if (project.previewUrl && project.previewUrl.trim()) {
        return `<a href="${project.previewUrl}" class="card-link-btn preview" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Live Preview
        </a>`;
      }
      return '';
    }

    function renderCards(projects) {
      const grid = document.getElementById('projectsGrid');

      if (projects.length === 0) {
        grid.innerHTML = `<div class="loading">No projects found.</div>`;
        return;
      }

      const url = (id) => `project-single.html?name=${id}`;

      grid.innerHTML = projects.map((project) => {
        const color = project.color || '#fbac2f';
        const logoPath = project.logo ? `../content/projects/${project.id}${project.logo}` : null;
        const badge = project.badge || '';
        const linkBtn = buildLinkBtn(project);

        return `
          <div class="project-card" role="link" tabindex="0"
            onclick="window.location.href='${url(project.id)}'"
            onkeydown="if(event.key==='Enter')window.location.href='${url(project.id)}'">
            <div class="card-image" style="background: ${color};">
              ${logoPath ? `<img src="${logoPath}" alt="${project.title}" class="card-logo">` : ''}
              <div class="card-image-gradient"></div>
              <div class="card-overlay-info">
                ${badge ? `<div class="card-badge">${badge}</div>` : ''}
                <div class="card-overlay-title">${project.title}</div>
              </div>
            </div>
            <div class="card-body">
              <div class="card-list-header">
                ${badge ? `<span class="card-badge">${badge}</span>` : ''}
                <span class="card-list-title">${project.title}</span>
              </div>
              <p class="card-desc">${project.description}</p>
              ${linkBtn}
            </div>
          </div>
        `;
      }).join('');

      if (currentView === 'list') grid.classList.add('list-view');
      else grid.classList.remove('list-view');
    }

    async function loadProjects() {
      const grid = document.getElementById('projectsGrid');
      try {
        const response = await fetch('../content/projects/manifest.json');
        if (!response.ok) throw new Error('Failed to load');
        const data = await response.json();
        const projectIds = data.all || [];

        if (projectIds.length === 0) {
          grid.innerHTML = `<div class="loading">No projects yet.</div>`;
          return;
        }

        const projects = await Promise.all(projectIds.map(id => loadProjectManifest(id)));
        allProjects = projects.filter(p => p !== null);
        buildFilterTabs(allProjects);
        renderCards(allProjects);
      } catch (error) {
        grid.innerHTML = `<div class="loading">Unable to load projects.</div>`;
      }
    }

    loadProjects();
  </script>
</body>
</html>
